[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "indic-language-utils"
version = "0.1.1"
description = "Provider-neutral foundations for Indian language applications"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "indic-language-utils contributors" }]
keywords = ["indic", "language", "translation", "speech"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.28,<1"]

[project.optional-dependencies]
googletrans = ["googletrans>=4.0.2"]
local-tld = ["fasttext-langdetect>=1.1.1"]
server = ["fastapi>=0.115.0", "uvicorn[standard]>=0.34.0"]

[project.scripts]
indic-server = "indic_language_utils.server.app:run_server"

[project.urls]
Documentation = "https://github.com/hari31416/indic-language-utils"
Source = "https://github.com/hari31416/indic-language-utils"

[dependency-groups]
dev = [
  "build>=1.2.2",
  "fastapi>=0.115.0",
  "fasttext-langdetect>=1.1.1",
  "googletrans>=4.0.2",
  "mypy>=1.15",
  "pre-commit>=4.6.2",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.11",
  "uvicorn[standard]>=0.34.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/indic_language_utils"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live_bhashini: requires explicit Bhashini credentials and network access"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
