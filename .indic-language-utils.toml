[cache]
enabled = true
backend = "sqlite"
path = ".cache/translations.sqlite3"
namespace = "language-utils"
max_entries = 50000
ttl_seconds = 86400

[retry]
max_attempts = 3
base_delay_seconds = 0.5
max_delay_seconds = 2.0

[telemetry]
logging_enabled = true
metrics_enabled = true
traces_enabled = true
include_content = false

[providers.bhashini]
endpoint = "https://dhruva-api.bhashini.gov.in/services/inference/pipeline"
translation_service_id = "ai4bharat/indictrans-v2-all-gpu--t4"
stt_model_id = "bhashini/bodhan/asr-transcribe-core"
tts_model_id = "Bhashini/IITM/TTS"
timeout_seconds = 20.0
max_concurrency = 8

[providers.bhashini.stt_model_ids]
"en-IN" = "ai4bharat/whisper-medium-en--gpu--t4"
"hi-IN" = "ai4bharat/conformer-hi-gpu--t4"
"ta-IN" = "ai4bharat/conformer-multilingual-dravidian-gpu--t4"
"te-IN" = "ai4bharat/conformer-multilingual-dravidian-gpu--t4"

[providers.googletrans]
timeout_seconds = 20.0
max_concurrency = 4

[providers.google_free]
timeout_seconds = 20.0
max_concurrency = 4

[providers.faster_whisper]
model = "base"
timeout_seconds = 60.0
max_concurrency = 2

[providers.sarvam]
endpoint = "https://api.sarvam.ai"
model = "sarvam-translate:v1"
stt_model_id = "saaras:v4"
tts_model_id = "bulbul:v3"
timeout_seconds = 20.0
max_concurrency = 8

[providers.edge_tts]
tts_model_id = "hi-IN-SwaraNeural"
timeout_seconds = 30.0
max_concurrency = 4

[routes]
translation = ["bhashini", "googletrans"]
transliteration = ["aksharamukha", "bhashini", "indicxlit"]
speech_to_text = ["bhashini", "sarvam"]
text_to_speech = ["bhashini", "sarvam", "edge_tts"]
