name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/indic-language-utils
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Verify Tag Matches Package Version
        run: |
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag version $tag_version does not match package version $package_version."
            exit 1
          fi

      - name: Run Tests
        run: |
          uv sync --locked --dev
          uv audit --locked
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest

      - name: Build Package
        run: uv build

      - name: Test the built wheel
        run: |
          wheel_venv="$(mktemp -d)/venv"
          uv venv "$wheel_venv"
          uv pip install --python "$wheel_venv/bin/python" dist/indic_language_utils-*.whl
          cd /tmp
          EXPECTED_VERSION="${GITHUB_REF_NAME#v}" "$wheel_venv/bin/python" -c 'import os; import indic_language_utils; assert indic_language_utils.__version__ == os.environ["EXPECTED_VERSION"]'

      - name: Extract Changelog Section
        id: extract_changelog
        run: |
          python -c '
          import os
          import re
          from pathlib import Path

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          pattern = rf"##\s+\[{re.escape(tag)}\][\s\S]*?(?=\n##\s+\[|\Z)"
          match = re.search(pattern, changelog)
          if match is None:
              raise SystemExit(f"Missing changelog entry for {tag}")
          body = "\n".join(match.group(0).strip().split("\n")[1:]).strip()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("body<<EOF\n")
              f.write(body + "\n")
              f.write("EOF\n")
          '

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') }}
          body: ${{ steps.extract_changelog.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
