name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/indic-language-utils
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Verify Tag Matches Package Version
        run: |
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag version $tag_version does not match package version $package_version."
            exit 1
          fi

      - name: Run Tests
        run: uv run pytest

      - name: Build Package
        run: uv build

      - name: Extract Changelog Section
        id: extract_changelog
        run: |
          python -c '
          import os
          import re
          from pathlib import Path

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          tag = "${{ github.ref_name }}".lstrip("v")
          pattern = rf"##\s+\[{re.escape(tag)}\][\s\S]*?(?=\n##\s+\[|\Z)"
          match = re.search(pattern, changelog)
          if match:
              content = match.group(0).strip()
              content_lines = content.split("\n")[1:]
              body = "\n".join(content_lines).strip()
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  f.write("body<<EOF\n")
                  f.write(body + "\n")
                  f.write("EOF\n")
          else:
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  f.write("body=No changelog entry found for this version.\n")
          '

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: ${{ steps.extract_changelog.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
